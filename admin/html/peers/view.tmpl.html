<div id="peer-view">
  <h2>View Peer</h2>
  <div class="fields-container">
    <div class="field">
      <p class="name">Public key:</p>
      <p class="value">{{.PublicKey}}</p>
    </div>
    <div class="field">
      <p class="name">Preshared key:</p>
      <p class="value">{{.PresharedKey}}</p>
    </div>
    <div class="field">
      <p class="name">Node:</p>
      <a href='{{EncryptURI "nodes/%s" .Node.UUID.String}}'>{{.Node.Name}}</a>
    </div>
    <div class="field">
      <p class="name">Owner:</p>
      <a href='{{EncryptURI "users/%s" .UserUUID}}'>{{ShortenUUID .UserUUID}}</a>
    </div>
    <div class="field">
      <p class="name">Status:</p>
      {{if .IsEnabled}}
        <p class="value peer-status-enabled">Enabled</p>
      {{else}}
        <p class="value peer-status-disabled">Disabled</p>
      {{end}}
    </div>
    <div class="field">
      <p class="name">Endpoint:</p>
      <p>
        {{if .LatestEndpoint}}
          {{.LatestEndpoint}}
        {{else}}
          (none)
        {{end}}
      </p>
    </div>
  </div>
</div>
