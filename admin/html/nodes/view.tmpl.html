<div id="node-view" hx-swap-oob="true">
  {{$readonly := not (AuthUser .R).Scopes.Nodes.HasW}}

  {{if .Node.UUID}}
    <h2>View &amp; edit node</h2>
  {{else}}
    <h2>Add new node</h2>
  {{end}}

  <form
    id="node-config-form"
    hx-swap="none"
    {{if .Node.UUID}}
      hx-put='{{EncryptURI "nodes/%s" .Node.UUID}}'
    {{else}}
      hx-post='{{EncryptURI "nodes"}}'
    {{end}}
    hx-disabled-elt="find input[type='submit']"
  >
    <label for="name" class="required">Name</label>
    <span id="invalid-name"></span>
    <input id="name" name="name" type="text" value="{{.Node.Name}}"
      {{if $readonly}}
        disabled
      {{end}}
    />

    <label for="base-uri" class="required">Base URI</label>
    <span id="invalid-base-uri"></span>
    <input id="base-uri" name="base-uri" type="text" value="{{.Node.BaseURI}}"
      {{if $readonly}}
        disabled
      {{end}}
    />

    <input
      class="submit"
      type="submit"
      value="{{if .Node.UUID}}Save{{else}}Create{{end}}"
      {{if $readonly}}
        disabled
      {{end}}
    />
  </form>
</div>
